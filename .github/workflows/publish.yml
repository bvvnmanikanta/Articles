name: Publish Articles

on:
  pull_request:
    branches:
    - main
    types:
    - closed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
    
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Install Dependencies
        run: |
          sudo apt-get update
    
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra
    
      - name: Create Required Directories
        run: |
          mkdir -p pdfs
          mkdir -p docs/articles
          mkdir -p .cache
    
      - name: Generate Changed Articles
        shell: bash
        run: |
    
          changed=false
    
          for file in articles/*.md
          do
    
            [ -f "$file" ] || continue
    
            filename=$(basename "$file" .md)
    
            HASH_FILE=".cache/${filename}.sha256"
    
            CURRENT_HASH=$(sha256sum "$file" | cut -d' ' -f1)
    
            OLD_HASH=""
    
            if [ -f "$HASH_FILE" ]; then
              OLD_HASH=$(cat "$HASH_FILE")
            fi
    
            if [ "$CURRENT_HASH" != "$OLD_HASH" ]; then
    
              echo "Processing ${filename}"
    
              pandoc "$file" \
                --standalone \
                --toc \
                --template=templates/medium.html \
                -o "docs/articles/${filename}.html"
    
              pandoc "$file" \
                --pdf-engine=xelatex \
                -V geometry:margin=1in \
                -V fontsize=12pt \
                -o "pdfs/${filename}.pdf"
    
              echo "$CURRENT_HASH" > "$HASH_FILE"
    
              changed=true
    
            else
    
              echo "Skipping ${filename}"
    
            fi
    
          done
    
          echo "changed=$changed" >> $GITHUB_ENV
    
      - name: Generate Index Page
        run: |
          python scripts/generate_site.py
    
      - name: Commit Generated Content
        run: |
    
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
    
          git add pdfs docs .cache
    
          if git diff --cached --quiet
          then
            echo "No changes to commit"
          else
            git commit -m "Auto-publish articles"
            git push
          fi
